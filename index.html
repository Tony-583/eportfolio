<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tony Jin — Split Layout Test</title>
    
    <!-- ── 🛠️ Self-Contained Layout Engine (Cache-Proof) ── -->
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden; /* Prevents the outer browser window from double-scrolling */
            width: 100vw;
            height: 100vh;
        }

        /* This container forces the 2-column split screen */
        .portfolio-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 🟢 LEFT SIDEBAR (Fixed 25% width, green background) */
        .left-sidebar {
            flex: 0 0 25%; 
            background-color: #0f5132; /* Deep Emerald Green */
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 2rem;
        }

        .sidebar-inner {
            text-align: center;
            width: 100%;
        }

        .sidebar-inner h2 {
            margin-bottom: 2rem;
        }

        .nav-links-vertical {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .nav-links-vertical a {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.7);
            font-weight: bold;
            font-size: 1.2rem;
            display: block;
        }

        .nav-links-vertical a:hover {
            color: #ffffff;
        }

        /* ⚪ RIGHT PANEL TRACK (Scrollable 75% width) */
        .right-content-track {
            flex: 0 0 75%; 
            height: 100vh;
            overflow-y: scroll; /* Activates scrolling ONLY on the right panel */
            scroll-behavior: smooth; /* Triggers the smooth glide animation */
        }

        /* Test Section Blocks */
        .scroll-section {
            width: 100%;
            height: 100vh; /* Every section matches the exact screen height */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem;
        }

        /* Gives alternate sections a light gray background so you can see them change */
        .scroll-section:nth-child(even) {
            background-color: #f8f9fa; 
        }

        .section-content h1 {
            font-size: 3rem;
            color: #212529;
        }
    </style>
</head>
<body>

    <!-- Main Dual Column Layout Wrapper -->
    <main class="portfolio-container">
        
        <!-- LEFT SIDEBAR PANEL -->
        <aside class="left-sidebar">
            <div class="sidebar-inner">
                <h2>Tony Jin</h2>
                
                <nav class="side-nav">
                    <ul class="nav-links-vertical">
                        <li><a href="#section1">About</a></li>
                        <li><a href="#section2">Projects</a></li>
                        <li><a href="#section3">Resume</a></li>
                        <li><a href="#section4">Contact</a></li>
                    </ul>
                </nav>
            </div>
        </aside>

        <!-- RIGHT CONTENT TRACK -->
        <section class="right-content-track">
            
            <article id="section1" class="scroll-section">
                <div class="section-content">
                    <h1>[Section 1: About Panel Displayed]</h1>
                </div>
            </article>

            <article id="section2" class="scroll-section">
                <div class="section-content">
                    <h1>[Section 2: Projects Panel Displayed]</h1>
                </div>
            </article>

            <article id="section3" class="scroll-section">
                <div class="section-content">
                    <h1>[Section 3: Resume Panel Displayed]</h1>
                </div>
            </article>

            <article id="section4" class="scroll-section">
                <div class="section-content">
                    <h1>[Section 4: Contact Panel Displayed]</h1>
                </div>
            </article>

        </section>
    </main>

</body>
</html>
